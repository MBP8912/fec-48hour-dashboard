name: Unpublish retired 2026 election-results dashboard

# One-time site deployment only. No election-result fetching or scheduled runs.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/election-night-update.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 2026-district-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out frozen dashboards
        uses: actions/checkout@v4
      - name: Package FEC and prediction dashboards, excluding election-night results
        run: |
          mkdir -p _site/assets _site/data
          cp index.html _site/
          cp assets/* _site/assets/
          cp data/data.json _site/data/
          mkdir -p _site/race-assets
          cp race-assets/app.js race-assets/styles.css race-assets/spiros-consulting-logo.png _site/race-assets/
          for district in co-4 co-5 ia-1 mn-1 ne-2 wi-1 ny-19 ca-13; do
            mkdir -p "_site/$district/data"
            cp "$district/index.html" "_site/$district/"
            cp "$district/data/data.json" "_site/$district/data/"
          done
          cp ca-13/spiros-consulting-logo.png _site/ca-13/
          cp -R predictions _site/predictions
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish remaining dashboards only
        id: deployment
        uses: actions/deploy-pages@v4
