name: Refresh nine 2026 FEC district dashboards

on:
  push:
    branches: [main]
  schedule:
    - cron: '11 * * * *' # GitHub scheduled tasks may be delayed
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 2026-district-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test FEC parser
        run: python -m unittest discover -s tests -v
      - name: Refresh original FEC Form 6 notices
        id: refresh
        continue-on-error: true # Preserve an accessible public page if the upstream FEC API is unavailable
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python scripts/update_data.py
      - name: Refresh eight independent 2026 district datasets
        id: multirace
        continue-on-error: true
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python scripts/update_races.py
      - name: Archive verified filing data
        if: steps.refresh.outcome == 'success' || steps.multirace.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cache.json data/data.json co-4/data co-5/data ia-1/data mn-1/data ne-2/data wi-1/data ny-19/data ca-13/data
          if ! git diff --cached --quiet; then
            git commit -m 'Update Form 6 dataset [skip ci]'
            git pull --rebase -X theirs origin main
            git push
          fi
      - name: Explain upstream data failures
        if: steps.refresh.outcome != 'success'
        run: echo "FEC refresh was unavailable; deploying the last verified dataset. Check the refresh step logs."
      - name: Report other race refresh exceptions
        if: steps.multirace.outcome != 'success'
        run: echo "Some districts were unavailable; their last verified data is preserved."
      - name: Assemble website
        run: |
          mkdir -p _site/assets _site/data
          cp index.html _site/
          cp assets/* _site/assets/
          cp data/data.json _site/data/
          mkdir -p _site/race-assets
          cp race-assets/app.js race-assets/styles.css _site/race-assets/
          for district in co-4 co-5 ia-1 mn-1 ne-2 wi-1 ny-19 ca-13; do
            mkdir -p "_site/$district/data"
            cp "$district/index.html" "_site/$district/"
            cp "$district/data/data.json" "_site/$district/data/"
          done
          touch _site/.nojekyll
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public dashboard
        id: deployment
        uses: actions/deploy-pages@v4
