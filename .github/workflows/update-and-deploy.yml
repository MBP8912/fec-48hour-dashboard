name: Refresh FEC filings and publish dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: '11 * * * *' # GitHub scheduled tasks may be delayed
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ny17-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test FEC parser
        run: python -m unittest discover -s tests -v
      - name: Refresh original FEC Form 6 notices
        id: refresh
        continue-on-error: true # Preserve an accessible public page if the upstream FEC API is unavailable
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python scripts/update_data.py
      - name: Archive verified filing data
        if: steps.refresh.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cache.json data/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Form 6 dataset [skip ci]'
            git push
          fi
      - name: Explain upstream data failures
        if: steps.refresh.outcome != 'success'
        run: echo "FEC refresh was unavailable; deploying the last verified dataset. Check the refresh step logs."
      - name: Assemble website
        run: |
          mkdir -p _site/assets _site/data
          cp index.html _site/
          cp assets/* _site/assets/
          cp data/data.json _site/data/
          touch _site/.nojekyll
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public dashboard
        id: deployment
        uses: actions/deploy-pages@v4
